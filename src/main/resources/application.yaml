server:
  port: 8087

spring:
  application:
    name: ead-authuser-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ead-authuser
    username: postgres
    password: pos123

  jpa:
    hibernate:
      ddl-auto: validate

#    properties:
#      hibernate:
#        show_sql: true
#        format_sql: true

  flyway:
